<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GV REVIEWS - Letterboxd</title>
    <link rel="stylesheet" href="/static/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <div style="background: rgba(11, 12, 16, 0.9); border-bottom: 1px solid #1f242d;">
        <header class="navbar">
            <div class="logo" id="navHome" style="cursor: pointer;">
                <span class="logo-dot"></span> GV REVIEWS
            </div>
            <div style="display: flex; gap: 12px; align-items: center;">
                <button id="navFilmes" class="btn-cyan" style="background: transparent; color: #fff; border: 1px solid #232936;">Filmes</button>
                <button id="navUsuarios" class="btn-cyan" style="background: transparent; color: #fff; border: 1px solid #232936;">Membros</button>
                <button id="btnToggleLogin" class="btn-pink" style="background: transparent; color: #fff; border: 1px solid #232936;">Entrar</button>
                <button id="btnToggleReview" class="btn-pink" style="background: transparent; color: #fff; border: 1px solid #232936;">Registrar Review</button>
            </div>
        </header>

    <main class="container">

        <!-- PAINEL DE LOGIN (PROJETO 2 - JWT) -->
        <div id="loginBox" style="display: none; background: #151821; border: 1px solid #232936; border-radius: 12px; padding: 20px; margin-bottom: 25px; width: 100%; max-width: 450px; margin-left: auto; margin-right: auto;">
            <h3 style="margin-bottom: 12px; color: #fff;">Login de Usuário</h3>
            <input type="text" id="loginUser" placeholder="Usuário (ex: gustavomelo)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #232936; background: #0b0c10; color: #fff;" />
            <input type="password" id="loginPass" placeholder="Senha (ex: senha123)" style="width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #232936; background: #0b0c10; color: #fff;" />
            <button id="btnFazerLogin" class="btn-cyan" style="width: 100%;">Fazer Login</button>
            <p id="loginMsg" style="margin-top: 10px; font-size: 0.85rem; text-align: center;"></p>
        </div>

        <!-- PAINEL DE REGISTRO DE REVIEW (PROJETO 2 - PROTEGIDO POR LOGIN) -->
        <div id="reviewBox" style="display: none; background: #151821; border: 1px solid #232936; border-radius: 12px; padding: 20px; margin-bottom: 25px; width: 100%; max-width: 550px; margin-left: auto; margin-right: auto;">
            <h3 style="margin-bottom: 12px; color: #fff;">Nova Avaliação de Filme</h3>
            <input type="text" id="revTitle" placeholder="Título do Filme (ex: Interstellar)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #232936; background: #0b0c10; color: #fff;" />
            <input type="number" id="revRating" placeholder="Nota de 0 a 10 (ex: 9)" min="0" max="10" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #232936; background: #0b0c10; color: #fff;" />
            <input type="text" id="revPoster" placeholder="URL da Capa (opcional)" style="width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #232936; background: #0b0c10; color: #fff;" />
            <textarea id="revContent" placeholder="Escreva sua crítica sobre o filme..." rows="3" style="width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #232936; background: #0b0c10; color: #fff;"></textarea>  
            <button id="btnSalvarReview" class="btn-pink" style="width: 100%;">Publicar Avaliação</button>
            <p id="reviewMsg" style="margin-top: 10px; font-size: 0.85rem; text-align: center;"></p>
        </div>
        
        <!-- TELA DE REVIEWS E BUSCA -->
        <div id="reviewsView">
            <section class="welcome-banner">
                <span class="badge">GV REVIEWS DIÁRIO</span>
                <h1>Boa noite, Verô.</h1>
                <p>O que você assistiu recentemente? Adicione impressões, estrelas ou registre um novo favorito para a sua coleção.</p>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Digite o título do filme..." />
                    <button id="searchBtn" class="btn-cyan">+ Pesquisar</button>
                </div>
            </section>

            <section class="recent-section">
                <div class="section-header">
                    <h2>Assistindo & Recentes</h2>
                </div>
                <div id="reviewsGrid" class="grid"></div>

                <!-- paginação -->
                <div class="pagination">
                    <button id="prevBtn" class="btn-secondary">Anterior</button>
                    <span id="pageInfo">Página 1</span>
                    <button id="nextBtn" class="btn-secondary">Próxima</button>
                </div>
            </section>
        </div>

        <!-- TELA DE PERFIL DE USUÁRIO -->
        <div id="userView" style="display: none; width: 100%;">
            <button id="backBtn" class="btn-secondary" style="margin-bottom: 20px;">← Voltar para Avaliações</button>
            <div id="userContainer"></div>
        </div>

                <!-- TELA DE LISTAGEM DE USUÁRIOS PAGINADA : recuperação -->
        <div id="usersListView" style="display: none; width: 100%;">
            <section class="recent-section">
                <div class="section-header">
                    <h2>Membros da Comunidade</h2>
                </div>
                <div id="usersGrid" class="grid"></div>

                <div class="pagination">
                    <button id="prevUserBtn" class="btn-secondary">Anterior</button>
                    <span id="pageUserInfo">Página 1</span>
                    <button id="nextUserBtn" class="btn-secondary">Próxima</button>
                </div>
            </section>
        </div>

    </main>

    <script src="/static/main.js"></script>
</body>
</html>
